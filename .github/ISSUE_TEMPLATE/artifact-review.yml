name: Submit an artifact review
description: Record the public availability or condition of research artifacts.
title: "[Artifact review] arXiv:"
labels: ["submission:artifact-review", "status:pending"]
body:
  - type: input
    id: arxiv
    attributes:
      label: arXiv ID
      placeholder: "YYMM.NNNNN"
    validations:
      required: true
  - type: dropdown
    id: paper_version
    attributes:
      label: Paper version
      description: Choose the exact arXiv version, or leave the default to resolve the latest version at submission time.
      options:
        - latest
        - v1
        - v2
        - v3
        - v4
        - v5
        - v6
        - v7
        - v8
        - v9
        - v10
        - v11
        - v12
        - v13
        - v14
        - v15
        - v16
        - v17
        - v18
        - v19
        - v20
        - v21
        - v22
        - v23
        - v24
        - v25
        - v26
        - v27
        - v28
        - v29
        - v30
        - v31
        - v32
        - v33
        - v34
        - v35
        - v36
        - v37
        - v38
        - v39
        - v40
        - v41
        - v42
        - v43
        - v44
        - v45
        - v46
        - v47
        - v48
        - v49
        - v50
      default: 0
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated PaperTrust tags.
      placeholder: "checkpoint_missing, raw_results_missing"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Markdown is supported. State only verifiable artifact facts and where you checked. Raw HTML and embedded images are rejected.
      placeholder: "State which official resources were checked and what public artifacts were or were not found."
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence DOI
      description: Optional but encouraged. Provide a DOI for independently archived review material when available.
      placeholder: "10.5281/zenodo.1234567"
    validations:
      required: false

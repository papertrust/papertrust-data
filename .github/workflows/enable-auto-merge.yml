name: Enable auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request writable collaborators individually
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          mapfile -t reviewers < <(
            gh api --paginate "repos/$REPO/collaborators?affiliation=all&per_page=100"               --jq '.[] | select(.type == "User" and (.permissions.push == true or .permissions.admin == true)) | .login'               | sort -u
          )

          args=()
          for reviewer in "${reviewers[@]}"; do
            [ "$reviewer" = "$PR_AUTHOR" ] && continue
            args+=(-f "reviewers[]=$reviewer")
          done

          if [ "${#args[@]}" -gt 0 ]; then
            gh api --method POST               "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers"               "${args[@]}" >/dev/null
          fi

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_URL" --repo "$REPO" --auto --squash --delete-branch

name: Enable auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request PaperTrust reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api             --method POST             "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers"             -f reviewers[]=ggipp             -f reviewers[]=papertrustAdrian             -f reviewers[]=heclay111             -f reviewers[]=Norsky957 >/dev/null

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_URL" --repo "$REPO" --auto --squash --delete-branch

name: Process submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Source PaperTrust issue number to regenerate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: papertrust-issue-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prepare dispatched issue event
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          gh api "repos/$REPO/issues/$ISSUE" > /tmp/papertrust-issue.json
          jq -n --slurpfile issue /tmp/papertrust-issue.json '{issue: $issue[0]}' > /tmp/papertrust-event.json
          echo "PAPERTRUST_EVENT_PATH=/tmp/papertrust-event.json" >> "$GITHUB_ENV"

      - name: Run submission parser tests
        run: python -m unittest discover -s tests -v

      - name: Validate submission format
        id: validate
        continue-on-error: true
        run: |
          kind="$(python scripts/validate_issue.py)"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"

      - name: Reject invalid submission
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          branch="papertrust/issue-$ISSUE"
          existing="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr close "$existing" --repo "$REPO" --comment "The source issue no longer satisfies the PaperTrust submission format."
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pending" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:format-valid" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pr-open" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:needs-review" 2>/dev/null || true
          gh issue comment "$ISSUE" --repo "$REPO" --body "This submission does not satisfy the PaperTrust format requirements and has been closed automatically. Edit the structured fields and reopen the issue to try again."
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

      - name: Mark format-valid
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.validate.outputs.kind }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pending" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:needs-review" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:format-valid"
          case "$KIND" in
            reproduction) type_label="submission:reproduction" ;;
            artifact_review) type_label="submission:artifact-review" ;;
            *) exit 1 ;;
          esac
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "$type_label"

      - name: Generate canonical record
        id: generate
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/issue_to_record.py
          python scripts/validate.py

      - name: Mark conversion failure for review
        if: steps.validate.outcome == 'success' && steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:format-valid" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:needs-review"
          gh issue comment "$ISSUE" --repo "$REPO" --body "The structured fields are valid, but PaperTrust could not resolve or convert this submission automatically. No record was written; a maintainer should review it."

      - name: Detect duplicate
        if: steps.generate.outcome == 'success'
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- papers)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close duplicate submission
        if: steps.generate.outcome == 'success' && steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:duplicate"
          gh issue comment "$ISSUE" --repo "$REPO" --body "An equivalent canonical PaperTrust record already exists. No pull request is needed."
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

      - name: Create or update canonical-record PR
        if: steps.generate.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          branch="papertrust/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add papers
          git commit -m "Add record from issue #$ISSUE"
          git push --force origin "HEAD:refs/heads/$branch"

          sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context="PaperTrust / validate" \
            -f description="Canonical record passed schema validation" >/dev/null

          pr_body="$(printf 'Generated automatically from a format-valid community submission.\n\nSource issue: #%s\n\nCloses #%s\n\nReviewers should verify the evidence and the canonical YAML diff before merging.' "$ISSUE" "$ISSUE")"

          pr_number="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$REPO" \
              --title "Add PaperTrust record from issue #$ISSUE" \
              --body "$pr_body"
          else
            pr_url="$(gh pr create \
              --repo "$REPO" \
              --head "$branch" \
              --base main \
              --title "Add PaperTrust record from issue #$ISSUE" \
              --body "$pr_body")"
            pr_number="${pr_url##*/}"
            gh issue comment "$ISSUE" --repo "$REPO" --body "Format validation passed. The canonical-record pull request is ready for review: $pr_url"
          fi

          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:pr-open"

          mapfile -t reviewers < <(
            gh api --paginate "repos/$REPO/collaborators?affiliation=all&per_page=100" \
              --jq '.[] | select(.type == "User" and (.permissions.push == true or .permissions.admin == true)) | .login' \
              | sort -u
          )
          pr_author="$(gh api "repos/$REPO/pulls/$pr_number" --jq '.user.login')"
          args=()
          for reviewer in "${reviewers[@]}"; do
            [ "$reviewer" = "$pr_author" ] && continue
            args+=(-f "reviewers[]=$reviewer")
          done
          if [ "${#args[@]}" -gt 0 ]; then
            gh api --method POST \
              "repos/$REPO/pulls/$pr_number/requested_reviewers" \
              "${args[@]}" >/dev/null
          fi

          gh pr merge "$pr_number" --repo "$REPO" --auto --squash --delete-branch

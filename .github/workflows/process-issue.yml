name: Process submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Source PaperTrust issue number to regenerate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: papertrust-issue-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prepare dispatched issue event
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          gh api "repos/$REPO/issues/$ISSUE" > /tmp/papertrust-issue.json
          jq -n --slurpfile issue /tmp/papertrust-issue.json '{issue: $issue[0]}' > /tmp/papertrust-event.json
          echo "PAPERTRUST_EVENT_PATH=/tmp/papertrust-event.json" >> "$GITHUB_ENV"

      - name: Run submission parser tests
        run: python -m unittest discover -s tests -v

      - name: Validate submission format
        id: validate
        continue-on-error: true
        run: |
          kind="$(python scripts/validate_issue.py)"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"

      - name: Reject invalid submission
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          branch="papertrust/issue-$ISSUE"
          existing="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr close "$existing" --repo "$REPO" --comment "The source issue no longer satisfies the PaperTrust submission format."
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pending" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:format-valid" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pr-open" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:needs-review" 2>/dev/null || true
          gh issue comment "$ISSUE" --repo "$REPO" --body "This submission does not satisfy the PaperTrust format requirements and has been closed automatically. Edit the structured fields and reopen the issue to try again."
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

      - name: Mark format-valid
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.validate.outputs.kind }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:pending" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:needs-review" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:format-valid"
          case "$KIND" in
            reproduction) type_label="submission:reproduction" ;;
            artifact_review) type_label="submission:artifact-review" ;;
            *) exit 1 ;;
          esac
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "$type_label"

      - name: Generate canonical record
        id: generate
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/issue_to_record.py
          python scripts/validate.py

      - name: Mark conversion failure for review
        if: steps.validate.outcome == 'success' && steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:format-valid" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:needs-review"
          gh issue comment "$ISSUE" --repo "$REPO" --body "The structured fields are valid, but PaperTrust could not resolve or convert this submission automatically. No record was written; a maintainer should review it."

      - name: Detect duplicate
        if: steps.generate.outcome == 'success'
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- papers)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close duplicate submission
        if: steps.generate.outcome == 'success' && steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:duplicate"
          gh issue comment "$ISSUE" --repo "$REPO" --body "An equivalent canonical PaperTrust record already exists. No pull request is needed."
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

      - name: Create or update canonical-record PR
        if: steps.generate.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          branch="papertrust/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add papers
          git commit -m "Add record from issue #$ISSUE"
          git push --force origin "HEAD:refs/heads/$branch"

          sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context="PaperTrust / validate" \
            -f description="Canonical record passed schema validation" >/dev/null

          record_file="$(git show --name-only --format='' HEAD -- papers | sed '/^$/d' | head -n1)"
          python - "$record_file" "$ISSUE" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          import yaml

          from scripts.submission import fetch_arxiv_metadata

          path = Path(sys.argv[1])
          issue = sys.argv[2]
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          record = data["records"][-1]
          arxiv_id = str(path.with_suffix("")).removeprefix("papers/")
          record_type = record["type"]
          paper_version = record.get("paper_version", "n/a")
          tags = ", ".join(record.get("tags", [])) or "none"
          evidence = ", ".join(record.get("evidence", [])) or "not supplied (optional)"
          summary = record["summary"]
          paper = fetch_arxiv_metadata(arxiv_id, paper_version)

          def markdown_text(value):
              return re.sub(r"([\\\x60*_{}\[\]<>#|])", r"\\\1", value)

          paper_title = markdown_text(paper.title)
          paper_authors = ", ".join(markdown_text(author) for author in paper.authors)
          paper_abstract = markdown_text(paper.abstract)
          paper_abs_url = f"https://arxiv.org/abs/{arxiv_id}{paper_version}"
          pr_title = f"Add PaperTrust record (arXiv:{arxiv_id})"

          metadata = {
              "arxiv_id": arxiv_id,
              "type": record_type,
              "paper_version": paper_version,
              "tags": tags,
              "evidence": evidence,
              "pr_title": pr_title,
          }
          Path("/tmp/papertrust-metadata.json").write_text(
              json.dumps(metadata), encoding="utf-8"
          )

          body = f"""Generated automatically from a format-valid PaperTrust submission.

          ## Paper
          - **Title:** {paper_title}
          - **Authors:** {paper_authors}
          - **arXiv:** [arXiv:{arxiv_id} {paper_version}]({paper_abs_url})
          - **PDF:** [Open PDF]({paper.pdf_url})

          ### Abstract

          {paper_abstract}

          ## Canonical record
          - **Source issue:** #{issue}
          - **Resolved paper version:** {paper_version}
          - **Record type:** {record_type}
          - **Tags:** {tags}
          - **Evidence DOI:** {evidence}

          ## PaperTrust summary

          {summary}

          ## Automated checks
          - Submission parser and injection-safety tests: **passed**
          - Canonical YAML/schema validation: **passed**
          - Required status **PaperTrust / validate**: **success**
          - Auto-merge: **enabled**
          - Merge policy: **2 approvals required**
          - Temporary source branch: **deleted automatically after merge**

          Reviewers should verify the factual evidence and the canonical YAML diff. The source Issue will close automatically when this PR merges.

          Closes #{issue}
          """
          Path("/tmp/papertrust-pr-body.md").write_text(body, encoding="utf-8")
          PY

          arxiv_id="$(jq -r .arxiv_id /tmp/papertrust-metadata.json)"
          record_type="$(jq -r .type /tmp/papertrust-metadata.json)"
          paper_version="$(jq -r .paper_version /tmp/papertrust-metadata.json)"
          tags="$(jq -r .tags /tmp/papertrust-metadata.json)"
          evidence="$(jq -r .evidence /tmp/papertrust-metadata.json)"
          pr_title="$(jq -r .pr_title /tmp/papertrust-metadata.json)"

          pr_number="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$REPO" \
              --title "$pr_title" \
              --body-file /tmp/papertrust-pr-body.md
          else
            pr_url="$(gh pr create \
              --repo "$REPO" \
              --head "$branch" \
              --base main \
              --title "$pr_title" \
              --body-file /tmp/papertrust-pr-body.md)"
            pr_number="${pr_url##*/}"

            issue_comment="$(cat <<EOF
          PaperTrust accepted this structured submission and generated its canonical record.

          - **Canonical PR:** $pr_url
          - **arXiv:** $arxiv_id
          - **Resolved version:** $paper_version
          - **Type:** $record_type
          - **Tags:** $tags
          - **Evidence DOI:** $evidence
          - **Parser/security tests:** passed
          - **Canonical validation:** passed
          - **Auto-merge:** enabled
          - **Merge gate:** 2 approvals

          The PaperTrust reviewers team is requested automatically. Once any 2 eligible reviewers approve, GitHub will squash-merge the PR, delete its temporary branch, and close this Issue automatically.
          EOF
            )"
            gh issue comment "$ISSUE" --repo "$REPO" --body "$issue_comment"

            gh pr comment "$pr_number" --repo "$REPO" --body "Automation initialized successfully. The record was generated from Issue #$ISSUE on the current main branch, validated, marked with the required PaperTrust / validate status, and placed in protected auto-merge. No PR code was executed during validation."
          fi

          gh issue edit "$ISSUE" --repo "$REPO" --add-label "status:pr-open"

          gh api --method POST             "repos/$REPO/pulls/$pr_number/requested_reviewers"             -f team_reviewers[]=reviewers >/dev/null

          gh pr merge "$pr_number" --repo "$REPO" --auto --squash --delete-branch

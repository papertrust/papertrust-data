name: Validate records

on:
  pull_request:
    paths:
      - "papers/**/*.yaml"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/process-issue.yml"
      - ".github/workflows/validate-pr.yml"

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test untrusted submission parsing
        id: parser_tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Validate canonical data
        id: validation
        continue-on-error: true
        run: python scripts/validate.py

      - name: Publish required validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PARSER_OUTCOME: ${{ steps.parser_tests.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          if [ "$PARSER_OUTCOME" = "success" ] && [ "$VALIDATION_OUTCOME" = "success" ]; then
            state="success"
            description="Canonical data and submission parser passed validation"
          else
            state="failure"
            description="PaperTrust validation failed"
          fi

          gh api \
            --method POST \
            "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="PaperTrust / validate" \
            -f description="$description" >/dev/null

      - name: Fail invalid pull request
        if: steps.parser_tests.outcome != 'success' || steps.validation.outcome != 'success'
        run: exit 1

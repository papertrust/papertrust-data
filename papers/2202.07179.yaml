  summary: 'A peer-reviewed 2023 ReScience C replication attempted to reproduce eight claims about G-Mixup. The study reports that missing implementation details prevented reproduction of all original results: some claims were supported, but several results remained ambiguous and the observed advantage over baseline augmentation methods was weaker than reported in the original paper. The replicators state that they had to infer experimental settings, hyperparameters, and model details that were not fully specified.'

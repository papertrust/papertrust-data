  summary: A peer-reviewed 2023 ReScience C replication evaluated Automatic Multi-Label Prompting on three GLUE datasets and extended the study to two additional datasets. On the reproduced GLUE tasks, the reported metrics fell within the standard deviations reported by the original paper and supported the tested performance claims. Because the replication covered a defined subset of the original experimental scope, this record conservatively marks the outcome as partially reproduced. The report also notes missing dependency information in the released implementation.

  summary: A peer-reviewed 2023 ReScience C replication reproduced the phase diagrams for the paper's toy setting and observed similar behavior on MNIST. A broader hyperparameter sweep exposed an additional memorization region and led the replicators to describe the original MNIST phase characterization as incomplete. The report also states that critical hyperparameters, including the toy-model activation and MNIST batch size, were not specified in the paper and had to be clarified with the authors.
